server {
    listen 80;
    server_name crm.analitgaz.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 60 always;
        return 503 'CRM HTTPS activation in progress. Please try again shortly.\n';
    }
}
